<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#18181b"/>
      <stop offset="100%" style="stop-color:#3f3f46"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="520" fill="url(#bgGrad)"/>
  
  <!-- 标题 -->
  <text x="400" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#18181b">MyAgent 工作流程</text>
  
  <!-- 用户输入 -->
  <g filter="url(#shadow)">
    <rect x="60" y="65" width="120" height="45" rx="8" fill="#fff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="120" y="93" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#18181b">用户指令</text>
  </g>
  
  <!-- 箭头1 -->
  <path d="M180 87 L220 87" stroke="#a1a1aa" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- DeepSeek API -->
  <g filter="url(#shadow)">
    <rect x="220" y="55" width="130" height="65" rx="10" fill="url(#primaryGrad)"/>
    <text x="285" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">DeepSeek API</text>
    <text x="285" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a1a1aa">推理决策 · 快速响应</text>
  </g>
  
  <!-- 箭头2 -->
  <path d="M350 87 L390 87" stroke="#a1a1aa" stroke-width="2" fill="none"/>
  
  <!-- Windows-MCP -->
  <g filter="url(#shadow)">
    <rect x="390" y="55" width="140" height="65" rx="10" fill="#fff" stroke="#f97316" stroke-width="2"/>
    <text x="460" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#18181b">Windows-MCP</text>
    <text x="460" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f97316">主力 · UI元素识别</text>
  </g>
  
  <!-- 箭头到执行 -->
  <path d="M530 87 L570 87" stroke="#a1a1aa" stroke-width="2" fill="none"/>
  
  <!-- 执行操作 -->
  <g filter="url(#shadow)">
    <rect x="570" y="55" width="140" height="65" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="640" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#18181b">执行操作</text>
    <text x="640" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#a1a1aa">鼠标 · 键盘自动化</text>
  </g>
  
  <!-- VLM 兜底路径 -->
  <g filter="url(#shadow)">
    <rect x="310" y="160" width="140" height="50" rx="8" fill="#fff" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="380" y="183" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#71717a">VLM 视觉识别</text>
    <text x="380" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a1a1aa">兜底方案</text>
  </g>
  
  <!-- Windows-MCP 到 VLM 的箭头 -->
  <path d="M460 120 L460 140 L380 140 L380 160" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
  <text x="430" y="135" font-family="system-ui, sans-serif" font-size="9" fill="#a1a1aa">失败时</text>
  
  <!-- VLM 到 执行 的箭头 -->
  <path d="M450 185 L530 185 L530 140 L580 140 L580 120" stroke="#a1a1aa" stroke-width="1.5" stroke-dasharray="4,2" fill="none"/>
  
  <!-- 核心技术模块 -->
  <g filter="url(#shadow)">
    <rect x="60" y="240" width="680" height="110" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="400" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#18181b">核心技术栈</text>
    
    <!-- 技术卡片 -->
    <rect x="80" y="280" width="145" height="55" rx="6" fill="#fef3c7"/>
    <text x="152" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#92400e">DeepSeek API</text>
    <text x="152" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#a16207">云端推理 · 快速响应</text>
    
    <rect x="240" y="280" width="145" height="55" rx="6" fill="#fed7aa"/>
    <text x="312" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9a3412">Windows-MCP</text>
    <text x="312" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#c2410c">UI元素识别 · 主力方案</text>
    
    <rect x="400" y="280" width="145" height="55" rx="6" fill="#e0e7ff"/>
    <text x="472" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#3730a3">Qwen2.5-VL</text>
    <text x="472" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#4f46e5">视觉理解 · 兜底方案</text>
    
    <rect x="560" y="280" width="160" height="55" rx="6" fill="#dcfce7"/>
    <text x="640" y="302" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#166534">本地记忆系统</text>
    <text x="640" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#15803d">SQLite + Qdrant</text>
  </g>
  
  <!-- 工作流程说明 -->
  <g filter="url(#shadow)">
    <rect x="60" y="370" width="680" height="85" rx="10" fill="#fff" stroke="#e4e4e7" stroke-width="1"/>
    <text x="400" y="395" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#18181b">处理流程</text>
    
    <circle cx="100" cy="425" r="14" fill="url(#primaryGrad)"/>
    <text x="100" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fff">1</text>
    <text x="125" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#52525b">用户输入指令</text>
    
    <circle cx="260" cy="425" r="14" fill="url(#primaryGrad)"/>
    <text x="260" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fff">2</text>
    <text x="285" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#52525b">DeepSeek推理决策</text>
    
    <circle cx="430" cy="425" r="14" fill="url(#accentGrad)"/>
    <text x="430" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fff">3</text>
    <text x="455" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#52525b">MCP识别元素</text>
    
    <circle cx="580" cy="425" r="14" fill="#22c55e"/>
    <text x="580" y="430" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#fff">4</text>
    <text x="605" y="430" font-family="system-ui, sans-serif" font-size="11" fill="#52525b">执行自动化操作</text>
  </g>
  
  <!-- 底部说明 -->
  <text x="400" y="490" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#a1a1aa">基于 ReAct 范式 · Windows-MCP主力识别 · VLM视觉兜底</text>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a1a1aa"/>
    </marker>
  </defs>
</svg>